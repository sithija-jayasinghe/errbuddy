# Creates a GitHub Release whenever a version tag (v1.2.3) is pushed.
# The release notes are that version's section of error-solution-ai-buddy/CHANGELOG.md.
#
# For tags created before this workflow existed, open Actions -> Release ->
# "Run workflow" and enter the tag (for example v1.0.0).
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to create a release for (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: error-solution-ai-buddy
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Check out the tagged code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: error-solution-ai-buddy/package-lock.json

      - name: Check the tag matches package.json
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION"
            exit 1
          fi

      - name: Install and test
        run: |
          npm ci
          npm test

      - name: Read release notes from the CHANGELOG on main
        run: |
          git fetch --depth=1 origin main
          git show origin/main:error-solution-ai-buddy/CHANGELOG.md > "$RUNNER_TEMP/CHANGELOG.md"
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/       { exit }
            found && /^\[[^]]+\]: / { exit }
            found                   { print }
          ' "$RUNNER_TEMP/CHANGELOG.md" > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::No section for [$VERSION] in CHANGELOG.md"
            exit 1
          fi
          {
            echo ""
            echo "**Install:** \`npm install -g error-solution-ai-buddy@$VERSION\`"
            echo ""
            echo "npm: https://www.npmjs.com/package/error-solution-ai-buddy/v/$VERSION"
          } >> "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only the highest version is marked "Latest", so creating a release
          # for an old tag later never hides the newest one.
          git fetch --tags --force --quiet
          HIGHEST="$(git tag -l 'v*.*.*' --sort=-v:refname | head -n 1)"
          if [ "$TAG" = "$HIGHEST" ]; then LATEST=true; else LATEST=false; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, updating its notes"
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --latest="$LATEST"
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag --latest="$LATEST"
          fi
